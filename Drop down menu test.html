<!doctype html>

<html lang="en">

<head>

  <meta charset="utf-8">

  <title>Dropdown on hover</title>

<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

/* Hier komt de nav */
.nav {
  font-family: Arial, sans-serif;
  background: #333;
  padding: 10 px;
}

/* Top-level item */
.nav ul {
  list-style: none;
  display: inline-block;
  position: relative;
}

.nav > ul > li {
  position: relative;       
  display: inline-block;
  margin-right: 1 rem;
}

/* Opmaak top level link */
.nav a {
  color: #fff;
  text-decoration: none;
  padding: 8 px 12 px;
  display: inline-block;
}

/* Submenu */
.nav ul ul {
  display: none;             /* Altijd verbergen */
  position: absolute;
  left: 0;
  top: 100;                 /* Plek onder bovenstaande */
  background: #fff;
  border: 1 px solid #ccc;
  min-width: 180 px;
  z-index: 100;
}

/* Submenu links */
.nav ul ul li a {
  color: #333;
  padding: 8 px 12 px;
  display: block;
}

/* Laat de onder niveau alleen zien als de cursor erop staat */
.nav > ul > li:hover > ul {
  display: block;
}

/* Hover states */
.nav ul ul li a:hover {
  background: #f2f2f2;
}

</style>
</head>
<body>

<nav class="nav">
  <ul>
    <li>
      <a href="Computer binnenkant.html">computer insides</a>
      <ul>
        <li><a href="Binair stelsel.html">Binary system</a></li>
        <li><a href="Kleurmodellen.html">Color models</a></li>
      </ul>
    </li>
  </ul>
</nav>

</body>
</html>
